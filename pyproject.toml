[project]
name = "text2sql-seguro"
version = "1.0.0"
description = "Assistente de dados com text-to-SQL seguro (modelo local via Ollama)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "."]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["text2sql", "eval"]

[tool.coverage.run]
source = ["src/text2sql"]
